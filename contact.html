<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제휴 문의 - Fighter Jet Strike</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a1a2a;
            color: #00ff00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 10px;
            border: 2px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #00ff00;
            color: #00ff00;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus, textarea:focus {
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        button {
            width: 100%;
            padding: 15px;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            text-transform: uppercase;
        }
        button:hover {
            background: #00cc00;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #00ff00;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>제휴 문의</h1>
        <!-- Formspree ID를 아래 Action URL의 'your-id-here' 자리에 넣으세요 -->
        <form action="https://formspree.io/f/your-id-here" method="POST">
            <div class="form-group">
                <label for="company">업체명/성함</label>
                <input type="text" id="company" name="company" required placeholder="예: (주)에이전시 / 홍길동">
            </div>
            <div class="form-group">
                <label for="email">이메일 주소</label>
                <input type="email" id="email" name="_replyto" required placeholder="contact@example.com">
            </div>
            <div class="form-group">
                <label for="phone">연락처</label>
                <input type="tel" id="phone" name="phone" placeholder="010-0000-0000">
            </div>
            <div class="form-group">
                <label for="message">문의 내용</label>
                <textarea id="message" name="message" rows="5" required placeholder="제휴하고 싶은 내용을 상세히 적어주세요."></textarea>
            </div>
            <input type="hidden" name="_subject" value="[Fighter Jet Strike] 새로운 제휴 문의가 도착했습니다.">
            <button type="submit">문의 보내기</button>
        </form>
        <a href="index.html" class="back-link">← 게임으로 돌아가기</a>
    </div>
</body>
</html>
