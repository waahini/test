<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Fighter Jet Game - Strike!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container"></div>
    <div id="hud">
        <div class="stat">SCORE: <span id="score">0</span></div>
        <div class="stat">ALTITUDE: <span id="altitude">0</span>m</div>
        <div class="stat">DISTANCE: <span id="distance">0</span>m</div>
        <div class="hint">ARROWS to steer • SPACE to shoot • SHIFT to Boost</div>
        <div class="hint" style="margin-top: 10px;">
            <a href="contact.html" style="color: #00ffff; text-decoration: none; border: 1px solid #00ffff; padding: 5px 10px; pointer-events: auto; display: inline-block;">제휴 문의</a>
        </div>
    </div>
    <div id="overlay" onclick="startGame()">
        <h1>FIGHTER JET STRIKE</h1>
        <p id="overlay-msg">Click or Press any key to start mission</p>
        <div class="sub-text">Operation Simulo-11</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
